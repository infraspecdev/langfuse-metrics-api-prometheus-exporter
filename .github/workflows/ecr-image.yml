name: ecr-image

# Builds the image for amd64 and arm64 on every push to main and pushes it to ECR as sha-<short commit>, with the
# push role from cloud-infrastructure/core/ecr/workload-images (OIDC, no stored keys). Releases don't rebuild:
# ecr-release.yml adds the vX.Y.Z tag to the image built here. The repository's tags are immutable, so a commit that
# is already in ECR is skipped.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The ECR repository and its push role (cloud-infrastructure/core/ecr/workload-images). Not secrets: the
# role trusts only this repository's main branch and v* tags (GitHub OIDC), so they are written here.
env:
  ECR_REPOSITORY_URL: 533267412035.dkr.ecr.ap-south-1.amazonaws.com/langfuse-metrics-api-prometheus-exporter
  ECR_PUSH_ROLE_ARN: arn:aws:iam::533267412035:role/langfuse-metrics-api-prometheus-exporter-ecr-push-gh-role

jobs:
  push:
    name: Build and push to ECR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # assume the ECR push role via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.ECR_PUSH_ROLE_ARN }}
          aws-region: ap-south-1
      - id: check
        name: Skip if this commit is already in ECR
        # batch-get-image, not describe-images: the push role may read images but not describe them.
        run: |
          tag="sha-${GITHUB_SHA::7}"
          found="$(aws ecr batch-get-image --repository-name "${ECR_REPOSITORY_URL#*/}" --image-ids imageTag="$tag" \
            --accepted-media-types application/vnd.oci.image.index.v1+json \
              application/vnd.docker.distribution.manifest.list.v2+json \
            --query 'length(images)' --output text)"
          if [ "$found" != "0" ]; then
            echo "::notice::$tag is already in ECR; nothing to build"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.check.outputs.exists != 'true' }}
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - if: ${{ steps.check.outputs.exists != 'true' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - if: ${{ steps.check.outputs.exists != 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        if: ${{ steps.check.outputs.exists != 'true' }}
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.ECR_REPOSITORY_URL }}
          tags: |
            type=sha,prefix=sha-
      - id: push
        if: ${{ steps.check.outputs.exists != 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Summary
        if: ${{ steps.check.outputs.exists != 'true' }}
        run: |
          {
            echo "### Pushed"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
